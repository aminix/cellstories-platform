<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass Health — Clinic Monitor</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#211E2B;
    --ink-dim:#5B5568;
    --ink-faint:#8B849A;
    --bg:#F7F5F9;
    --card:#FFFFFF;
    --line:#E6E1EE;
    --white:#FBFAFC;

    --lavender:#9B8FC4;
    --lavender-dim:#7C6FA8;
    --lavender-soft:#EFEBF7;

    --sky:#5FB8D6;
    --sky-dim:#3E96B3;
    --sky-soft:#E8F5F9;

    --lime:#A8CC3A;
    --lime-dim:#7E9C29;
    --lime-soft:#F0F6E1;

    --amber:#D9A441;
    --amber-dim:#B8842A;
    --amber-soft:#FBF1E0;

    --coral:#E2725B;
    --coral-dim:#C25A45;
    --coral-soft:#FBEAE6;

    --taupe:#A69C93;
    --taupe-soft:#F0EDE9;

    --display:'Fraunces', serif;
    --body:'Work Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink-dim);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  h1,h2,h3,h4{ font-family:var(--display); color:var(--ink); font-weight:600; letter-spacing:-0.01em; }

  /* ---------- Icons ---------- */
  .icon{ width:16px; height:16px; flex-shrink:0; vertical-align:-3px; }
  th .icon{ margin-right:5px; }

  /* ---------- Login ---------- */
  .login-screen{ min-height:100vh; background:var(--ink); display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--card); border-radius:20px; padding:44px 40px; max-width:400px; width:100%; box-shadow:0 24px 70px rgba(33,30,43,0.4); }
  .login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:30px; }
  .login-brand .mark{ width:30px; height:30px; flex-shrink:0; }
  .login-brand span{ font-family:var(--display); font-weight:700; font-size:1.15rem; color:var(--ink); }
  .login-card h1{ font-size:1.4rem; margin-bottom:8px; }
  .login-sub{ font-size:0.9rem; color:var(--ink-faint); margin-bottom:26px; line-height:1.55; }
  .login-card label{ display:block; font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; }
  .login-card input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:0.92rem;
    font-family:var(--body); color:var(--ink); margin-bottom:18px; background:var(--bg);
  }
  .login-card input:focus{ outline:none; border-color:var(--lavender); }
  .login-note{ text-align:center; font-size:0.78rem; color:var(--ink-faint); margin-top:18px; }

  /* ---------- Shell layout ---------- */
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex-shrink:0; background:var(--ink);
    padding:26px 18px; display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 8px; transition:opacity .15s; }
  .brand:hover{ opacity:0.85; }
  .brand .mark{ width:28px; height:28px; flex-shrink:0; }
  .brand span{ font-family:var(--display); font-weight:700; font-size:1.12rem; color:var(--white); }

  .proto-badge{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.04em; text-transform:uppercase;
    color:#F0B49F; background:rgba(226,114,91,0.16); border:1px solid rgba(226,114,91,0.34);
    padding:4px 8px; border-radius:6px; display:inline-block; width:fit-content; margin:0 8px;
  }

  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-label{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:rgba(251,250,252,0.38); padding:0 10px; margin-bottom:6px; }
  .nav-link{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px;
    font-size:0.92rem; color:rgba(251,250,252,0.74); font-weight:500;
  }
  .nav-link:hover{ background:rgba(251,250,252,0.07); color:var(--white); }
  .nav-link.active{ background:rgba(155,143,196,0.24); color:#D9D2ED; font-weight:600; }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(251,250,252,0.1); display:flex; flex-direction:column; gap:12px; }
  .sidebar-security{ display:flex; align-items:flex-start; gap:7px; font-size:0.72rem; color:rgba(251,250,252,0.42); line-height:1.4; padding:0 10px; }
  .sidebar-security .icon{ margin-top:1px; }
  .sidebar-signout{ background:none; border:none; text-align:left; padding:6px 10px; font-size:0.86rem; color:rgba(251,250,252,0.62); font-family:inherit; border-radius:8px; }
  .sidebar-signout:hover{ color:#fff; background:rgba(251,250,252,0.07); }

  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 40px;
    border-bottom:1px solid var(--line); background:var(--card);
  }
  .breadcrumb{ font-size:0.86rem; color:var(--ink-faint); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .breadcrumb a:hover{ color:var(--ink); }
  .breadcrumb .sep{ color:var(--line); }
  .breadcrumb .current{ color:var(--ink); font-weight:600; }

  .content{ padding:36px 40px 80px; max-width:1220px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:0.88rem; font-weight:600;
    padding:10px 18px; border-radius:10px; border:1px solid transparent; transition:all .15s ease;
  }
  .btn-primary{ background:var(--lavender-dim); color:#fff; }
  .btn-primary:hover{ background:#6A5D95; }
  .btn-secondary{ background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn-secondary:hover{ border-color:var(--ink-faint); }
  .btn-ghost{ color:var(--ink-dim); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-sm{ padding:7px 12px; font-size:0.8rem; }

  /* ---------- Page header ---------- */
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:28px; flex-wrap:wrap; }
  .page-head h1{ font-size:1.7rem; margin-bottom:6px; }
  .page-head p{ color:var(--ink-faint); font-size:0.94rem; max-width:64ch; }
  .eyebrow{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--lavender-dim); margin-bottom:8px; display:block; }

  /* ---------- KPI tiles ---------- */
  .kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
  .kpi-tile{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; align-items:center; gap:14px; }
  .kpi-icon{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .kpi-icon .icon{ width:21px; height:21px; margin:0; }
  .kpi-num{ font-family:var(--display); font-weight:700; font-size:1.55rem; color:var(--ink); line-height:1.15; }
  .kpi-lbl{ font-size:0.78rem; color:var(--ink-faint); margin-top:2px; }

  /* ---------- Cards / table ---------- */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:500; padding:0 14px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:14px; border-bottom:1px solid var(--line); font-size:0.88rem; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .1s; }
  tbody tr:hover{ background:var(--bg); cursor:pointer; }
  .code-cell{ font-family:var(--mono); font-weight:600; color:var(--ink); }
  .table-scroll{ overflow-x:auto; }

  .table-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:14px; flex-wrap:wrap; }
  .p-search-wrap{ position:relative; flex:1; min-width:180px; max-width:280px; }
  .p-search-wrap .icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); margin:0; }
  .p-search-wrap input{
    width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:9px; font-size:0.86rem;
    font-family:var(--body); color:var(--ink); background:var(--card);
  }
  .p-search-wrap input:focus{ outline:none; border-color:var(--lavender); }
  .p-toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .p-toolbar-right select{
    padding:8px 10px; border:1px solid var(--line); border-radius:9px; font-size:0.82rem;
    font-family:var(--body); color:var(--ink); background:var(--card);
  }
  .p-count{ font-size:0.78rem; color:var(--ink-faint); font-family:var(--mono); white-space:nowrap; }

  /* ---------- Week progress ---------- */
  .week-track{ display:flex; align-items:center; gap:8px; }
  .week-bar{ width:60px; height:6px; border-radius:4px; background:var(--taupe-soft); overflow:hidden; flex-shrink:0; }
  .week-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg, var(--sky-dim), var(--lavender)); }
  .week-lbl{ font-family:var(--mono); font-size:0.78rem; color:var(--ink-dim); white-space:nowrap; }

  /* ---------- Risk pill ---------- */
  .risk-pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:0.72rem; font-weight:600; padding:5px 11px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; }
  .risk-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .risk-pill.ontrack{ background:var(--lime-soft); color:var(--lime-dim); }
  .risk-pill.watch{ background:var(--amber-soft); color:var(--amber-dim); }
  .risk-pill.high{ background:var(--coral-soft); color:var(--coral-dim); }

  .trend-chip{ font-family:var(--mono); font-size:0.78rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .trend-chip.up{ color:var(--lime-dim); }
  .trend-chip.flat{ color:var(--ink-faint); }
  .trend-chip.down{ color:var(--coral-dim); }

  /* ---------- Patient detail ---------- */
  .pid-header{ display:flex; align-items:center; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  .pid-code{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--ink); }
  .pid-sub{ color:var(--ink-faint); font-size:0.86rem; margin-bottom:28px; }

  .pid-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .pid-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
  .pid-card h3{ font-size:0.98rem; margin-bottom:14px; }

  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .kv{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kv .k{ font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; color:var(--ink-faint); letter-spacing:0.04em; margin-bottom:5px; display:block; }
  .kv .v{ font-size:0.88rem; color:var(--ink); font-weight:600; }
  .kv .v.risk{ color:var(--coral-dim); }
  .kv .v.ok{ color:var(--lime-dim); }

  .chart-box{ margin-bottom:6px; }
  .chart-box h4{ font-size:0.84rem; margin-bottom:10px; color:var(--ink-dim); font-family:var(--body); font-weight:700; }
  .chart-legend{ display:flex; gap:16px; margin-top:8px; font-size:0.76rem; color:var(--ink-faint); }
  .chart-legend .item{ display:flex; align-items:center; gap:6px; }
  .chart-legend .sw{ width:14px; height:2px; border-radius:1px; }
  .chart-legend .sw.dashed{ background:repeating-linear-gradient(90deg, var(--ink-faint) 0 4px, transparent 4px 7px); }

  .factor-row{ margin-bottom:14px; }
  .factor-row:last-child{ margin-bottom:0; }
  .factor-label{ display:flex; justify-content:space-between; font-size:0.84rem; margin-bottom:6px; }
  .factor-label .name{ color:var(--ink); font-weight:600; }
  .factor-label .val{ font-family:var(--mono); color:var(--ink-faint); }
  .factor-track{ height:9px; border-radius:5px; background:var(--taupe-soft); overflow:hidden; }
  .factor-fill{ height:100%; border-radius:5px; }

  .note-box{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:14px; }
  .note-box textarea{ width:100%; border:none; background:none; font-family:var(--body); font-size:0.86rem; color:var(--ink); resize:vertical; min-height:50px; }
  .note-box textarea:focus{ outline:none; }

  /* ---------- Modal / toast (minimal, unused for now but kept for consistency) ---------- */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 20px; border-radius:10px; font-size:0.86rem; box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* ---------- Mobile / phone ---------- */
  @media (max-width:760px){
    .shell{ flex-direction:column; }
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:40;
      flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 14px;
      padding:12px 16px;
    }
    .brand{ padding:0; margin-right:auto; }
    .proto-badge{ margin:0; }
    .nav-group{ flex-direction:row; flex-wrap:wrap; gap:6px; width:100%; }
    .nav-label{ display:none; }
    .nav-link{ padding:7px 11px; }
    .sidebar-footer{ width:100%; margin-top:4px; padding-top:12px; }

    .topbar{ padding:14px 16px; }
    .content{ padding:20px 16px 60px; }
    .page-head h1{ font-size:1.4rem; }
    .page-head{ gap:14px; }
    .page-head .btn{ width:100%; justify-content:center; }

    .kpi-row{ grid-template-columns:1fr; }
    .pid-grid{ grid-template-columns:1fr; }
    .kv-grid{ grid-template-columns:1fr; }
  }

  @media (max-width:480px){
    .kpi-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="10.5" stroke="#9B8FC4" stroke-width="2"/>
        <circle cx="16" cy="16" r="6.5" stroke="#5FB8D6" stroke-width="2"/>
        <circle cx="16" cy="16" r="2" fill="#A8CC3A"/>
      </svg>
      <span>Compass Health</span>
    </div>
    <h1>Sign in to your clinic</h1>
    <p class="login-sub">Monitor patients on GLP-1 therapy through their first 12 weeks — catch what matters before the next appointment.</p>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="you@yourclinic.com" required />
    <label>Password</label>
    <input type="password" id="login-password" placeholder="••••••••" required />
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign In</button>
    <p class="login-note">Demo access — any email and password combination is accepted.</p>
  </form>
</div>

<div class="shell" id="shell" style="display:none;">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <div class="content" id="app"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Compass Health — clickable prototype
   Phase 1: on-treatment adaptive monitoring for women on
   GLP-1 therapy. Static demo: sample data only.
   ========================================================= */

const CLINIC_NAME = 'Thornbury Women\'s Health Clinic';
const DRUGS = ['Semaglutide','Tirzepatide'];

function seedRandom(seed){
  return function(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; };
}
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

const ICON_PATHS = {
  users:     '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.8-6 6-6s6 2.4 6 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14c2.4.3 4.5 2.3 5 6"/>',
  alert:     '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  clock:     '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  search:    '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.4-4.4"/>',
  lock:      '<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  chevron:   '<path d="M9 6l6 6-6 6"/>',
  dna:       '<path d="M7.5 3c0 6 9 6 9 12s-9 6-9 12"/><path d="M16.5 3c0 6-9 6-9 12s9 6 9 12"/><path d="M8 7.3h8M8 12h8M8 16.7h8"/>',
  activity:  '<path d="M3 12h4l2 8 4-16 2 8h6"/>',
  droplet:   '<path d="M12 3s7 7.6 7 12.2A7 7 0 1 1 5 15.2C5 10.6 12 3 12 3Z"/>',
};
function icon(name){
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;
}

/* ---------------- Sample data generation ---------------- */
const EXPECTED_CURVE = [0,-0.6,-1.3,-2.1,-2.9,-3.7,-4.5,-5.3,-6.0,-6.7,-7.3,-7.9,-8.4];

function buildPatients(){
  const rnd = seedRandom(2026);
  const patients = [];
  const total = 46;
  for(let i=1;i<=total;i++){
    const code = 'CH-'+String(i).padStart(5,'0');
    const drug = DRUGS[Math.floor(rnd()*DRUGS.length)];
    const week = 1 + Math.floor(rnd()*12);
    const glp1rFavorable = rnd() < 0.62;
    const giprFavorable = rnd() < 0.55;

    // responder profile: good / mixed / poor(high side-effect)
    const roll = rnd();
    const profile = roll < 0.52 ? 'good' : (roll < 0.78 ? 'mixed' : 'poor');

    const geneticRisk = Math.round(
      (glp1rFavorable ? 12 : 55) * 0.6 + (giprFavorable ? 10 : 45) * 0.4
    );

    const log = [];
    let flagWeek = null;
    let cumWeight = 0;
    let nausea = profile==='poor' ? 3 + rnd()*2 : (profile==='mixed' ? 1.5 + rnd()*1.5 : rnd()*1.5);
    let cgm = 148 + rnd()*10;

    for(let w=1; w<=week; w++){
      const expected = EXPECTED_CURVE[Math.min(w,12)];
      if(profile==='good'){
        cumWeight = expected + (rnd()*0.8-0.2);
        nausea = Math.max(0, nausea + (rnd()*0.8-0.6));
        cgm = Math.max(92, cgm - (0.8 + rnd()*0.6));
      } else if(profile==='mixed'){
        cumWeight = expected*0.6 + (rnd()*1.0-0.4);
        nausea = Math.max(0, nausea + (rnd()*1.0-0.3));
        cgm = Math.max(98, cgm - (0.3 + rnd()*0.5));
      } else {
        cumWeight = expected*0.25 + (rnd()*0.8-0.1);
        nausea = Math.min(10, nausea + (rnd()*1.3-0.1));
        cgm = cgm - (0.1 + rnd()*0.4) + (rnd()*0.6);
      }
      const adherence = Math.max(55, Math.round(100 - nausea*4.2 - rnd()*6));
      log.push({ week:w, weightPct:+cumWeight.toFixed(1), nausea:+nausea.toFixed(1), cgm:Math.round(cgm), adherence });

      const symptomRisk = Math.min(100, Math.round(nausea*9));
      const wearableRisk = Math.min(100, Math.round(Math.max(0, (cumWeight - expected*0.5)) * 14));
      const overall = Math.round(geneticRisk*0.25 + symptomRisk*0.5 + wearableRisk*0.25);
      if(flagWeek===null && overall >= 45){ flagWeek = w; }
    }

    const last = log[log.length-1];
    const symptomRisk = Math.min(100, Math.round(last.nausea*9));
    const wearableRisk = Math.min(100, Math.round(Math.max(0, (last.weightPct - EXPECTED_CURVE[Math.min(week,12)]*0.5)) * 14));
    const overall = Math.round(geneticRisk*0.25 + symptomRisk*0.5 + wearableRisk*0.25);
    const riskLevel = overall >= 42 ? 'high' : (overall >= 26 ? 'watch' : 'ontrack');

    patients.push({
      code, drug, week, glp1rFavorable, giprFavorable, profile, log,
      geneticRisk, symptomRisk, wearableRisk, overall, riskLevel, flagWeek,
    });
  }
  return patients;
}

const PATIENTS = buildPatients();

/* ---------------- Auth ---------------- */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', initAuth);

function initAuth(){
  const authed = sessionStorage.getItem('compass_authed') === '1';
  if(authed){ showApp(); return; }
  document.getElementById('login-form').addEventListener('submit', e=>{
    e.preventDefault();
    sessionStorage.setItem('compass_authed', '1');
    showApp();
  });
}
function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  render();
}
function signOut(){
  sessionStorage.removeItem('compass_authed');
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  location.hash = '';
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Router ---------------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  return h.split('/').filter(Boolean);
}
function render(){
  const parts = parseHash();
  renderSidebar(parts);
  if(parts[0]==='patient' && parts[1]){ return renderPatientPage(parts[1]); }
  if(parts[0]==='overview'){ return renderOverviewPage(); }
  return renderRosterPage();
}

/* ---------------- Sidebar ---------------- */
function renderSidebar(parts){
  const html = `
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="10.5" stroke="#FBFAFC" stroke-width="2"/>
        <circle cx="16" cy="16" r="6.5" stroke="#5FB8D6" stroke-width="2"/>
        <circle cx="16" cy="16" r="2" fill="#A8CC3A"/>
      </svg>
      <span>Compass Health</span>
    </a>
    <div class="proto-badge">Prototype · Sample Data</div>
    <div class="nav-group">
      <div class="nav-label">${escapeHtml(CLINIC_NAME)}</div>
      <a class="nav-link ${parts[0]!=='overview'?'active':''}" href="#/">${icon('users')}Patient Roster</a>
      <a class="nav-link ${parts[0]==='overview'?'active':''}" href="#/overview">${icon('activity')}Cohort Overview</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-security">${icon('lock')}<span>Built for UK MDR &amp; EU IVDR-aligned data handling</span></div>
      <button class="sidebar-signout" onclick="signOut()">Sign out</button>
    </div>`;
  document.getElementById('sidebar').innerHTML = html;
}
function renderBreadcrumb(items){
  document.getElementById('breadcrumb').innerHTML = items.map((it,i)=>{
    const last = i===items.length-1;
    return (i>0?'<span class="sep">/</span>':'') + (last ? `<span class="current">${escapeHtml(it.label)}</span>` : `<a href="${it.href}">${escapeHtml(it.label)}</a>`);
  }).join('');
}

function riskPill(level){
  const map = { ontrack:['On track','ontrack'], watch:['Watch','watch'], high:['High risk','high'] };
  const [label, cls] = map[level];
  return `<span class="risk-pill ${cls}"><span class="dot"></span>${label}</span>`;
}
function trendChip(patient){
  const last = patient.log[patient.log.length-1];
  const expected = EXPECTED_CURVE[Math.min(patient.week,12)];
  const diff = last.weightPct - expected;
  if(diff > 1.2) return `<span class="trend-chip up">↑ ahead of curve</span>`;
  if(diff < -1.5) return `<span class="trend-chip down">↓ behind curve</span>`;
  return `<span class="trend-chip flat">→ on curve</span>`;
}
function symptomChip(patient){
  const last = patient.log[patient.log.length-1];
  if(last.nausea >= 6) return `<span class="trend-chip down">↑ rising GI symptoms</span>`;
  if(last.nausea >= 3) return `<span class="trend-chip flat">→ mild GI symptoms</span>`;
  return `<span class="trend-chip up">↓ minimal GI symptoms</span>`;
}

/* ---------------- Patient Roster ---------------- */
function renderRosterPage(){
  renderBreadcrumb([{label:'Patient Roster', href:'#/'}]);
  const app = document.getElementById('app');

  const total = PATIENTS.length;
  const highRisk = PATIENTS.filter(p=>p.riskLevel==='high').length;
  const flagged = PATIENTS.filter(p=>p.flagWeek!==null);
  const avgFlagWeek = flagged.length ? (flagged.reduce((s,p)=>s+p.flagWeek,0)/flagged.length) : null;

  app.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">${escapeHtml(CLINIC_NAME)}</span>
        <h1>Patient Roster</h1>
        <p>Everyone currently in their first 12 weeks of GLP-1 therapy, with early signal on efficacy and GI-side-effect risk — not just the next weigh-in.</p>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--lavender-soft);color:var(--lavender-dim)">${icon('users')}</div>
        <div><div class="kpi-num">${total}</div><div class="kpi-lbl">Patients being monitored</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--coral-soft);color:var(--coral-dim)">${icon('alert')}</div>
        <div><div class="kpi-num">${highRisk}</div><div class="kpi-lbl">Currently flagged high risk</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--sky-soft);color:var(--sky-dim)">${icon('clock')}</div>
        <div><div class="kpi-num">${avgFlagWeek?avgFlagWeek.toFixed(1):'—'}</div><div class="kpi-lbl">Average week of first flag</div></div>
      </div>
    </div>

    <div class="table-toolbar">
      <div class="p-search-wrap">${icon('search')}<input type="text" id="p-search" placeholder="Search by code…" /></div>
      <div class="p-toolbar-right">
        <select id="p-filter">
          <option value="all">All risk levels</option>
          <option value="high">High risk</option>
          <option value="watch">Watch</option>
          <option value="ontrack">On track</option>
        </select>
        <select id="p-sort">
          <option value="risk-desc">Sort: Risk (high → low)</option>
          <option value="week-desc">Sort: Week (latest first)</option>
          <option value="week-asc">Sort: Week (earliest first)</option>
          <option value="code-asc">Sort: Code</option>
        </select>
        <span class="p-count" id="p-count"></span>
      </div>
    </div>

    <div class="card">
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Code</th><th>Week</th><th>Drug</th><th>${icon('activity')} Efficacy trend</th><th>${icon('droplet')} GI symptom trend</th><th>Risk</th>
        </tr></thead>
        <tbody id="p-tbody"></tbody>
      </table>
      </div>
    </div>
  `;

  function draw(){
    const q = document.getElementById('p-search').value.trim().toLowerCase();
    const filter = document.getElementById('p-filter').value;
    const sortBy = document.getElementById('p-sort').value;
    const rank = { high:2, watch:1, ontrack:0 };
    let rows = PATIENTS.filter(p=>{
      if(q && !p.code.toLowerCase().includes(q)) return false;
      if(filter!=='all' && p.riskLevel!==filter) return false;
      return true;
    });
    rows = rows.slice().sort((a,b)=>{
      if(sortBy==='risk-desc') return rank[b.riskLevel]-rank[a.riskLevel] || b.overall-a.overall;
      if(sortBy==='week-desc') return b.week-a.week;
      if(sortBy==='week-asc') return a.week-b.week;
      return a.code.localeCompare(b.code, undefined, {numeric:true});
    });
    document.getElementById('p-tbody').innerHTML = rows.map(p=>`
      <tr onclick="location.hash='#/patient/${p.code}'">
        <td class="code-cell">${p.code}</td>
        <td><div class="week-track"><div class="week-bar"><div class="week-fill" style="width:${p.week/12*100}%"></div></div><span class="week-lbl">${p.week}/12</span></div></td>
        <td>${p.drug}</td>
        <td>${trendChip(p)}</td>
        <td>${symptomChip(p)}</td>
        <td>${riskPill(p.riskLevel)}</td>
      </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--ink-faint);padding:30px;">No patients match your filters.</td></tr>`;
    document.getElementById('p-count').textContent = `${rows.length} of ${PATIENTS.length}`;
  }
  document.getElementById('p-search').addEventListener('input', draw);
  document.getElementById('p-filter').addEventListener('change', draw);
  document.getElementById('p-sort').addEventListener('change', draw);
  draw();
}

/* ---------------- Patient Detail ---------------- */
function renderPatientPage(code){
  const p = PATIENTS.find(x=>x.code===code);
  const app = document.getElementById('app');
  if(!p){ location.hash=''; return; }
  renderBreadcrumb([{label:'Patient Roster',href:'#/'},{label:code,href:'#'}]);

  const genoInterp = (p.glp1rFavorable && p.giprFavorable) ? 'Favorable variant profile for GLP-1 response'
    : (!p.glp1rFavorable && !p.giprFavorable) ? 'Higher-risk variant profile — reduced efficacy and elevated nausea risk'
    : 'Mixed variant profile';

  app.innerHTML = `
    <div class="pid-header">
      <div class="pid-code">${p.code}</div>
      ${riskPill(p.riskLevel)}
    </div>
    <div class="pid-sub">${p.drug} · Week ${p.week} of 12 · ${escapeHtml(CLINIC_NAME)}</div>

    <div class="pid-grid">
      <div class="pid-card">
        <h3>${icon('dna')} Baseline genetics</h3>
        <div class="kv-grid">
          <div class="kv"><span class="k">GLP1R variant</span><span class="v ${p.glp1rFavorable?'ok':'risk'}">${p.glp1rFavorable?'Favorable':'Risk allele'}</span></div>
          <div class="kv"><span class="k">GIPR variant</span><span class="v ${p.giprFavorable?'ok':'risk'}">${p.giprFavorable?'Favorable':'Risk allele'}</span></div>
        </div>
        <p style="font-size:0.84rem;color:var(--ink-dim);margin-top:14px;">${genoInterp}.</p>
      </div>

      <div class="pid-card">
        <h3>Why this patient is flagged</h3>
        ${factorRow('Genetic predisposition', p.geneticRisk)}
        ${factorRow('GI symptom trajectory', p.symptomRisk)}
        ${factorRow('Wearable / CGM signal', p.wearableRisk)}
      </div>
    </div>

    <div class="pid-card" style="margin-bottom:20px;">
      <div class="chart-box">
        <h4>Weight change vs. expected responder curve</h4>
        ${dualLineChart(p.log.map(l=>l.weightPct), EXPECTED_CURVE.slice(0,p.week), 'var(--lavender-dim)')}
        <div class="chart-legend">
          <div class="item"><span class="sw" style="background:var(--lavender-dim)"></span>This patient</div>
          <div class="item"><span class="sw dashed"></span>Expected responder curve</div>
        </div>
      </div>
    </div>

    <div class="pid-grid">
      <div class="pid-card">
        <div class="chart-box">
          <h4>GI symptom severity (0–10 scale)</h4>
          ${barChart(p.log.map(l=>l.nausea))}
        </div>
      </div>
      <div class="pid-card">
        <div class="chart-box">
          <h4>Continuous glucose monitor — weekly average (mg/dL)</h4>
          ${lineChart(p.log.map(l=>l.cgm), 'var(--sky-dim)')}
        </div>
      </div>
    </div>

    <div class="pid-card">
      <h3>Clinician note</h3>
      <div class="note-box">
        <textarea placeholder="Add a note for this patient's next check-in…"></textarea>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn btn-primary btn-sm">Flag for consult</button>
        <button class="btn btn-secondary btn-sm">Schedule check-in</button>
      </div>
    </div>
  `;
}

function factorRow(label, value){
  const color = value>=60 ? 'var(--coral)' : (value>=32 ? 'var(--amber)' : 'var(--lime)');
  return `<div class="factor-row">
    <div class="factor-label"><span class="name">${label}</span><span class="val">${value}/100</span></div>
    <div class="factor-track"><div class="factor-fill" style="width:${value}%;background:${color}"></div></div>
  </div>`;
}

function lineChart(values, color){
  const w=560,h=110,pad=10;
  const max=Math.max(...values), min=Math.min(...values);
  const pts = values.map((v,i)=>{
    const x = pad + (i/(Math.max(values.length-1,1)))*(w-2*pad);
    const y = h-pad - ((v-min)/((max-min)||1))*(h-2*pad);
    return x+','+y;
  }).join(' ');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function dualLineChart(actual, expected, color){
  const w=560,h=130,pad=10;
  const all = actual.concat(expected);
  const max=Math.max(...all), min=Math.min(...all);
  function toPts(values){
    return values.map((v,i)=>{
      const x = pad + (i/12)*(w-2*pad);
      const y = h-pad - ((v-min)/((max-min)||1))*(h-2*pad);
      return x+','+y;
    }).join(' ');
  }
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <polyline points="${toPts(expected)}" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${toPts(actual)}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function barChart(values){
  const w=560,h=110,pad=8,gap=4;
  const barW = (w-2*pad)/values.length - gap;
  const bars = values.map((v,i)=>{
    const bh = (v/10)*(h-2*pad);
    const x = pad + i*((w-2*pad)/values.length);
    const y = h-pad-bh;
    const color = v>=6 ? 'var(--coral)' : (v>=3 ? 'var(--amber)' : 'var(--lime)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"/>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}

/* ---------------- Cohort Overview ---------------- */
function renderOverviewPage(){
  renderBreadcrumb([{label:'Patient Roster',href:'#/'},{label:'Cohort Overview',href:'#'}]);
  const app = document.getElementById('app');

  const total = PATIENTS.length;
  const high = PATIENTS.filter(p=>p.riskLevel==='high').length;
  const watch = PATIENTS.filter(p=>p.riskLevel==='watch').length;
  const ontrack = total - high - watch;
  const flagged = PATIENTS.filter(p=>p.flagWeek!==null);
  const avgFlagWeek = flagged.length ? (flagged.reduce((s,p)=>s+p.flagWeek,0)/flagged.length) : 12;
  const retained = PATIENTS.filter(p=>!(p.riskLevel==='high' && p.week>=8)).length;
  const retentionPct = Math.round(retained/total*100);

  app.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">${escapeHtml(CLINIC_NAME)}</span>
        <h1>Cohort Overview</h1>
        <p>The value of catching GI-side-effect-driven dropout early, shown across the whole active caseload.</p>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--lime-soft);color:var(--lime-dim)">${icon('users')}</div>
        <div><div class="kpi-num">${ontrack}</div><div class="kpi-lbl">On track</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--amber-soft);color:var(--amber-dim)">${icon('alert')}</div>
        <div><div class="kpi-num">${watch}</div><div class="kpi-lbl">Watch</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--coral-soft);color:var(--coral-dim)">${icon('alert')}</div>
        <div><div class="kpi-num">${high}</div><div class="kpi-lbl">High risk</div></div>
      </div>
    </div>

    <div class="card" style="padding:26px 28px;margin-bottom:20px;">
      <h3 style="margin-bottom:8px;">Signal, weeks earlier</h3>
      <p style="font-size:0.9rem;color:var(--ink-dim);max-width:68ch;margin-bottom:20px;">Standard practice catches a struggling patient at the next scheduled weigh-in. Compass flags the same trajectory as soon as it emerges.</p>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:grid;grid-template-columns:190px 1fr 48px;align-items:center;gap:12px;">
          <div style="font-size:0.86rem;font-weight:600;color:var(--ink);">Traditional check-in</div>
          <div style="height:12px;border-radius:6px;background:var(--taupe-soft);overflow:hidden;"><div style="height:100%;width:100%;border-radius:6px;background:var(--taupe);"></div></div>
          <div style="font-family:var(--mono);font-weight:600;font-size:0.86rem;text-align:right;">Week 12</div>
        </div>
        <div style="display:grid;grid-template-columns:190px 1fr 48px;align-items:center;gap:12px;">
          <div style="font-size:0.86rem;font-weight:600;color:var(--ink);">Compass average flag</div>
          <div style="height:12px;border-radius:6px;background:var(--taupe-soft);overflow:hidden;"><div style="height:100%;width:${avgFlagWeek/12*100}%;border-radius:6px;background:linear-gradient(90deg, var(--sky-dim), var(--lavender));"></div></div>
          <div style="font-family:var(--mono);font-weight:600;font-size:0.86rem;text-align:right;">Week ${avgFlagWeek.toFixed(1)}</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:26px 28px;">
      <h3 style="margin-bottom:8px;">Retention</h3>
      <p style="font-size:0.9rem;color:var(--ink-dim);">${retentionPct}% of patients past week 8 are still on-track or in active management, rather than silently lapsing.</p>
    </div>
  `;
}
</script>
