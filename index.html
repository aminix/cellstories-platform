<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CellStories Platform — Prototype</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="./favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --dark:#17312C;
    --white:#FBFBFB;
    --bg:#F7F8F7;
    --card:#FFFFFF;

    --sage:#56B77E;
    --sage-dim:#3E9863;
    --sage-soft:#E9F6EE;

    --azure:#3E9BD6;
    --azure-dim:#2C7FB0;
    --azure-soft:#E8F3FA;

    --coral:#F2735B;
    --coral-hover:#E05C43;
    --coral-soft:#FDECE8;

    --grey:#9AA39D;
    --grey-soft:#EEF0EE;

    --ink:#16211E;
    --ink-dim:#54615C;
    --ink-faint:#8A968F;

    --line:#E4E8E5;

    --display:'Space Grotesk', sans-serif;
    --body:'Manrope', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink-dim);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  h1,h2,h3,h4{ font-family:var(--display); color:var(--ink); font-weight:600; letter-spacing:-0.01em; }

  /* ---------- Shell layout ---------- */
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:232px; flex-shrink:0; background:var(--dark);
    padding:24px 16px; display:flex; flex-direction:column; gap:24px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 8px; transition:opacity .15s; }
  .brand:hover{ opacity:0.8; }
  .brand .mark{ width:26px; height:26px; flex-shrink:0; }
  .brand span{ font-family:var(--display); font-weight:700; font-size:1.05rem; color:var(--white); }

  .proto-badge{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.04em; text-transform:uppercase;
    color:#FFB199; background:rgba(242,115,91,0.14); border:1px solid rgba(242,115,91,0.32);
    padding:4px 8px; border-radius:6px; display:inline-block; width:fit-content; margin:0 8px;
  }

  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-label{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:rgba(251,251,251,0.38); padding:0 10px; margin-bottom:6px; }
  .nav-link{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    font-size:0.9rem; color:rgba(251,251,251,0.72); font-weight:500;
  }
  .nav-link:hover{ background:rgba(251,251,251,0.07); color:var(--white); }
  .nav-link.active{ background:rgba(86,183,126,0.16); color:#7FD9A3; font-weight:600; }
  .nav-link .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.6; flex-shrink:0; }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(251,251,251,0.1); display:flex; flex-direction:column; gap:12px; }
  .sidebar-security{ display:flex; align-items:flex-start; gap:7px; font-size:0.72rem; color:rgba(251,251,251,0.42); line-height:1.4; padding:0 10px; }
  .sidebar-security .icon{ margin-top:1px; }
  .sidebar-signout{ background:none; border:none; text-align:left; padding:6px 10px; font-size:0.84rem; color:rgba(251,251,251,0.6); font-family:inherit; border-radius:8px; }
  .sidebar-signout:hover{ color:#fff; background:rgba(251,251,251,0.07); }

  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 40px;
    border-bottom:1px solid rgba(251,251,251,0.1); background:var(--dark);
  }
  .breadcrumb{ font-size:0.86rem; color:rgba(251,251,251,0.55); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .breadcrumb a:hover{ color:var(--white); }
  .breadcrumb .sep{ color:rgba(251,251,251,0.25); }
  .breadcrumb .current{ color:var(--white); font-weight:600; }

  .content{ padding:36px 40px 80px; max-width:1180px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:0.88rem; font-weight:600;
    padding:10px 18px; border-radius:9px; border:1px solid transparent; transition:all .15s ease;
  }
  .btn-primary{ background:var(--coral); color:#fff; }
  .btn-primary:hover{ background:var(--coral-hover); }
  .btn-secondary{ background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn-secondary:hover{ border-color:var(--ink-faint); }
  .btn-ghost{ color:var(--ink-dim); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-sm{ padding:7px 12px; font-size:0.8rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---------- Page header ---------- */
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:28px; flex-wrap:wrap; }
  .page-head h1{ font-size:1.6rem; margin-bottom:6px; }
  .page-head p{ color:var(--ink-faint); font-size:0.92rem; max-width:56ch; }
  .eyebrow{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--sage-dim); margin-bottom:8px; display:block; }

  /* ---------- Cards / table ---------- */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .card-pad{ padding:24px 26px; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
  .kpi-tile{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; align-items:center; gap:14px; }
  .kpi-icon{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .kpi-icon .icon{ width:21px; height:21px; }
  .kpi-num{ font-family:var(--display); font-weight:700; font-size:1.5rem; color:var(--ink); line-height:1.15; }
  .kpi-lbl{ font-size:0.76rem; color:var(--ink-faint); margin-top:2px; }

  .study-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
  .study-card{ padding:22px; display:flex; flex-direction:column; gap:14px; transition:border-color .15s; }
  .study-card:hover{ border-color:var(--sage); }
  .study-card .prefix-chip{
    font-family:var(--mono); font-size:0.72rem; font-weight:500; color:var(--azure-dim);
    background:var(--azure-soft); padding:3px 9px; border-radius:6px; width:fit-content;
  }
  .study-card h3{ font-size:1.1rem; }
  .study-card .meta{ font-size:0.82rem; color:var(--ink-faint); display:flex; gap:14px; }
  .study-card-new{
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    border:1.5px dashed var(--line); color:var(--ink-faint); font-weight:600; font-size:0.9rem; min-height:120px;
  }
  .study-card-new:hover{ border-color:var(--sage); color:var(--sage-dim); background:var(--sage-soft); }

  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:500; padding:0 14px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:14px; border-bottom:1px solid var(--line); font-size:0.88rem; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .1s; }
  tbody tr:hover{ background:var(--bg); cursor:pointer; }
  .code-cell{ font-family:var(--mono); font-weight:600; color:var(--ink); }
  .ptable td{ white-space:nowrap; }

  .status-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .status-dot.on{ background:var(--sage); }
  .status-dot.off{ background:var(--grey-soft); border:1.5px solid var(--line); }
  .status-row{ display:flex; gap:10px; align-items:center; }
  .status-row .lbl{ font-size:0.68rem; color:var(--ink-faint); font-family:var(--mono); }

  .completion{ display:flex; align-items:center; gap:8px; }
  .completion-track{ width:56px; height:6px; border-radius:4px; background:var(--grey-soft); overflow:hidden; flex-shrink:0; }
  .completion-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg, var(--azure-dim), var(--azure)); transition:width .2s ease, background .2s ease; }
  .completion-pct{ font-family:var(--mono); font-size:0.76rem; font-weight:500; color:var(--azure-dim); font-variant-numeric:tabular-nums; }
  .completion.complete .completion-fill{ background:var(--coral); }
  .completion.complete .completion-pct{ color:var(--coral-hover); }

  .table-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:14px; flex-wrap:wrap; }
  .p-search-wrap{ position:relative; flex:1; min-width:180px; max-width:280px; }
  .p-search-wrap .icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); margin:0; }
  .p-search-wrap input{
    width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:8px; font-size:0.86rem;
    font-family:var(--body); color:var(--ink); background:var(--card);
  }
  .p-search-wrap input:focus{ outline:none; border-color:var(--sage); }
  .p-toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .p-toolbar-right select{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:0.82rem;
    font-family:var(--body); color:var(--ink); background:var(--card);
  }
  .p-count{ font-size:0.78rem; color:var(--ink-faint); font-family:var(--mono); white-space:nowrap; }
  .tabs{ display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px; width:fit-content; margin-bottom:24px; }
  .tab{ padding:8px 16px; border-radius:8px; font-size:0.86rem; font-weight:600; color:var(--ink-faint); }
  .tab.active{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(20,30,25,0.06); }

  /* ---------- Participant detail ---------- */
  .pid-header{ display:flex; align-items:center; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  .pid-code{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--ink); }
  .pid-sub{ color:var(--ink-faint); font-size:0.86rem; margin-bottom:28px; }

  .data-cards{ display:flex; flex-direction:column; gap:16px; }
  .data-card{ border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden; }
  .data-card-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; gap:16px; flex-wrap:wrap; }
  .data-card-head .left{ display:flex; align-items:center; gap:12px; }
  .data-icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1.1rem; }
  .data-card-head h3{ font-size:1rem; margin-bottom:2px; }
  .data-card-head .sub{ font-size:0.78rem; color:var(--ink-faint); }
  .pill{ font-family:var(--mono); font-size:0.7rem; padding:4px 10px; border-radius:20px; font-weight:500; }
  .pill.done{ background:var(--sage-soft); color:var(--sage-dim); }
  .pill.empty{ background:var(--grey-soft); color:var(--ink-faint); }
  .data-card-body{ border-top:1px solid var(--line); padding:22px; background:var(--bg); overflow-x:auto; }
  .file-line{ font-size:0.8rem; color:var(--ink-faint); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .file-line svg{ flex-shrink:0; }

  .flag{ font-size:0.72rem; font-weight:600; padding:2px 8px; border-radius:6px; font-family:var(--mono); }
  .flag.normal{ background:var(--sage-soft); color:var(--sage-dim); }
  .flag.high{ background:var(--coral-soft); color:var(--coral-hover); }
  .flag.low{ background:var(--azure-soft); color:var(--azure-dim); }

  .mini-table td, .mini-table th{ padding:9px 12px; font-size:0.82rem; }
  .mini-table{ background:var(--card); border-radius:10px; overflow:hidden; border:1px solid var(--line); }

  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .kv{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .kv .k{ font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; color:var(--ink-faint); letter-spacing:0.04em; margin-bottom:6px; display:block; }
  .kv .v{ font-size:0.88rem; color:var(--ink); font-weight:500; }
  .tag{ display:inline-block; background:var(--azure-soft); color:var(--azure-dim); font-size:0.76rem; padding:3px 9px; border-radius:6px; margin:2px 4px 2px 0; }

  .chart-box{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:14px; }
  .chart-box h4{ font-size:0.82rem; margin-bottom:12px; color:var(--ink-dim); font-family:var(--body); font-weight:700; }

  .organoid-sub{ margin-bottom:20px; }
  .organoid-sub h4{ font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em; font-family:var(--mono); color:var(--ink-faint); margin-bottom:10px; font-weight:500; }
  .img-gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .img-tile{ aspect-ratio:1; border-radius:10px; display:flex; align-items:end; padding:8px; font-size:0.68rem; color:#fff; font-weight:600; background-size:cover; }
  .bar-cell{ position:relative; height:18px; background:var(--grey-soft); border-radius:4px; overflow:hidden; width:100px; }
  .bar-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:4px; }

  .heatmap-wrap{ overflow-x:auto; }
  .heatmap{ border-collapse:separate; border-spacing:4px; }
  .heatmap th{ font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-faint); font-weight:500; padding:4px 8px; text-align:center; border:none; white-space:nowrap; }
  .heatmap .heat-row-label{ text-align:right; font-family:var(--body); font-size:0.82rem; color:var(--ink); font-weight:600; text-transform:none; letter-spacing:0; padding-right:12px; }
  .heat-cell{ text-align:center; font-family:var(--mono); font-size:0.76rem; font-weight:600; padding:11px 14px; border-radius:6px; white-space:nowrap; }

  .empty-state{ text-align:center; padding:22px 10px; }
  .empty-state p{ font-size:0.84rem; color:var(--ink-faint); margin-bottom:14px; }

  /* ---------- Cohort analysis ---------- */
  .cohort-layout{ display:grid; grid-template-columns:1.3fr 1fr; gap:24px; align-items:start; }
  @media (max-width:900px){ .cohort-layout{ grid-template-columns:1fr; } }
  .cluster-svg-wrap{ padding:10px; }
  .legend{ display:flex; gap:18px; flex-wrap:wrap; padding:14px 26px 4px; font-size:0.8rem; color:var(--ink-dim); }
  .legend .item{ display:flex; align-items:center; gap:7px; }
  .legend .sw{ width:10px; height:10px; border-radius:50%; }

  .group-card{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; cursor:pointer; transition:all .15s; background:var(--card); }
  .group-card:hover{ border-color:var(--ink-faint); }
  .group-card.selected{ border-color:currentColor; box-shadow:0 0 0 1px currentColor; }
  .group-card .gtitle{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .group-card .sw{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .group-card h4{ font-size:0.92rem; font-family:var(--display); color:var(--ink); }
  .group-card .n{ font-size:0.76rem; color:var(--ink-faint); font-family:var(--mono); margin-left:auto; }
  .group-card p{ font-size:0.84rem; color:var(--ink-dim); }
  .group-card .codes{ margin-top:10px; display:flex; flex-wrap:wrap; gap:5px; }
  .group-card .codes span{ font-family:var(--mono); font-size:0.68rem; background:var(--bg); border:1px solid var(--line); padding:2px 6px; border-radius:5px; color:var(--ink-faint); }

  .run-panel{ text-align:center; padding:60px 30px; }
  .run-panel .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--sage); margin:0 auto 18px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Study Report ---------- */
  .report-actions{ display:flex; gap:10px; margin-bottom:20px; }
  .report-draft-banner{
    display:flex; align-items:center; gap:10px; background:var(--coral-soft); border:1px solid #F6CFC4;
    color:var(--coral-hover); font-family:var(--mono); font-size:0.74rem; letter-spacing:0.03em; text-transform:uppercase;
    padding:10px 16px; border-radius:10px; margin-bottom:20px;
  }
  .report-doc{ background:var(--card); border:1px solid var(--line); border-radius:14px; max-width:840px; margin:0 auto; padding:48px 56px; }
  .report-cover{ border-bottom:2px solid var(--ink); padding-bottom:24px; margin-bottom:32px; }
  .report-cover .kicker{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--sage-dim); margin-bottom:10px; }
  .report-cover h1{ font-size:1.7rem; margin-bottom:6px; }
  .report-cover .subtitle{ color:var(--ink-faint); font-size:1rem; margin-bottom:20px; }
  .report-meta-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .report-meta-grid div{ display:flex; flex-direction:column; gap:3px; }
  .report-meta-grid .k{ font-family:var(--mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); }
  .report-meta-grid .v{ font-size:0.88rem; color:var(--ink); font-weight:600; }
  .report-section{ margin-bottom:32px; }
  .report-section h2{ font-size:1.15rem; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .report-section h3{ font-size:0.96rem; margin:18px 0 8px; }
  .report-section p{ font-size:0.92rem; line-height:1.7; margin-bottom:12px; max-width:70ch; }
  .report-section ul, .report-section ol{ padding-left:22px; margin-bottom:12px; }
  .report-section li{ font-size:0.92rem; line-height:1.7; margin-bottom:6px; }
  .report-section table{ margin-bottom:12px; }
  .report-section .report-table th, .report-section .report-table td{ font-size:0.82rem; padding:9px 12px; }
  .report-table{ border:1px solid var(--line); border-radius:10px; overflow:hidden; width:100%; }
  .report-callout{
    background:var(--bg); border-left:3px solid var(--sage); border-radius:0 8px 8px 0;
    padding:14px 18px; font-size:0.88rem; color:var(--ink-dim); margin-bottom:14px;
  }
  .report-subtype-row{ display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .report-subtype-row .sw{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:0.72rem; color:#fff; margin-top:1px;
  }
  .report-footer{ margin-top:36px; padding-top:16px; border-top:1px solid var(--line); font-family:var(--mono); font-size:0.72rem; color:var(--ink-faint); }

  @media print{
    .sidebar, .topbar, .tabs, .report-actions, .proto-badge{ display:none !important; }
    body, .content{ background:#fff; padding:0; margin:0; }
    .report-doc{ border:none; max-width:none; padding:0; }
  }

  /* ---------- Subtype Predictor ---------- */
  .predict-how{ padding:26px 28px; margin-bottom:20px; }
  .predict-how h3{ font-size:1.05rem; margin-bottom:18px; }
  .predict-steps{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .predict-step{ display:flex; gap:14px; align-items:flex-start; }
  .predict-step .step-num{
    width:26px; height:26px; border-radius:50%; background:var(--dark); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:0.82rem;
  }
  .predict-step h4{ font-size:0.92rem; margin-bottom:6px; }
  .predict-step p{ font-size:0.86rem; color:var(--ink-dim); line-height:1.55; }

  .predict-intro{ padding:26px 28px; margin-bottom:20px; }
  .predict-intro h3{ font-size:1.05rem; margin-bottom:8px; }
  .predict-intro p{ font-size:0.9rem; color:var(--ink-dim); max-width:68ch; margin-bottom:16px; }
  .predict-note{ font-size:0.8rem; color:var(--ink-faint); margin-top:12px; }

  .predict-compare{ display:flex; flex-direction:column; gap:14px; }
  .compare-row{ display:grid; grid-template-columns:170px 1fr 48px; align-items:center; gap:12px; }
  .compare-label{ font-size:0.86rem; color:var(--ink); font-weight:600; }
  .compare-sub{ font-weight:400; color:var(--ink-faint); font-size:0.78rem; }
  .compare-track{ height:12px; border-radius:6px; background:var(--grey-soft); overflow:hidden; }
  .compare-fill{ height:100%; border-radius:6px; }
  .compare-fill.baseline{ background:var(--grey); }
  .compare-fill.model{ background:linear-gradient(90deg, var(--azure-dim), var(--sage)); }
  .compare-pct{ font-family:var(--mono); font-weight:600; font-size:0.86rem; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }

  .predict-future{ padding:26px 28px; margin-top:20px; }
  .predict-future h3{ font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .predict-future p{ font-size:0.88rem; color:var(--ink-dim); margin-bottom:10px; }
  .predict-future ul{ padding-left:20px; }
  .predict-future li{ font-size:0.87rem; color:var(--ink-dim); line-height:1.6; margin-bottom:8px; }

  .predict-select-row{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:6px; }
  .predict-select-row label{ display:block; font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; }
  .predict-select-row select{
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:var(--body); font-size:0.9rem;
    color:var(--ink); background:var(--card); min-width:240px;
  }
  .predict-warning{ font-size:0.84rem; color:var(--coral-hover); margin-top:10px; }

  .predict-result-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .predict-input-line{ font-size:0.84rem; padding:5px 0; display:flex; align-items:center; gap:8px; }
  .predict-input-line.used{ color:var(--ink-dim); }
  .predict-input-line.unused{ color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--line); }

  .predict-donut-row{ display:flex; align-items:center; gap:28px; padding-bottom:22px; margin-bottom:22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .donut-wrap{ flex-shrink:0; }
  .donut-legend{ flex:1; min-width:220px; }
  .donut-legend-row{ display:flex; align-items:center; gap:9px; padding:5px 0; font-size:0.86rem; color:var(--ink-dim); }
  .donut-legend-row .sw{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .donut-legend-row .name{ flex:1; }
  .donut-legend-row .pct{ font-family:var(--mono); font-size:0.82rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .donut-legend-row.top{ color:var(--ink); font-weight:700; }
  .donut-legend-row.top .pct{ color:var(--ink); }

  /* ---------- Login ---------- */
  .login-screen{ min-height:100vh; background:var(--dark); display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--card); border-radius:16px; padding:40px 36px; max-width:380px; width:100%; box-shadow:0 24px 70px rgba(0,0,0,0.35); }
  .login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .login-brand .mark{ width:26px; height:26px; flex-shrink:0; }
  .login-brand span{ font-family:var(--display); font-weight:700; font-size:1.02rem; color:var(--ink); }
  .login-card h1{ font-size:1.3rem; margin-bottom:6px; }
  .login-sub{ font-size:0.88rem; color:var(--ink-faint); margin-bottom:24px; }
  .login-card label{ display:block; font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; }
  .login-card input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem;
    font-family:var(--body); color:var(--ink); margin-bottom:16px; background:var(--bg);
  }
  .login-card input:focus{ outline:none; border-color:var(--sage); }
  .login-note{ text-align:center; font-size:0.78rem; color:var(--ink-faint); margin-top:16px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(22,33,30,0.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .modal h3{ font-size:1.1rem; margin-bottom:18px; }
  .modal label{ display:block; font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px; }
  .modal input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem;
    font-family:var(--body); color:var(--ink); margin-bottom:16px; background:var(--bg);
  }
  .modal input:focus{ outline:none; border-color:var(--sage); }
  .modal .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .code-preview{ font-family:var(--mono); background:var(--sage-soft); color:var(--sage-dim); padding:10px 12px; border-radius:8px; font-size:0.86rem; margin-bottom:16px; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 20px; border-radius:10px; font-size:0.86rem; box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .icon{ width:15px; height:15px; flex-shrink:0; vertical-align:-3px; }
  th .icon{ margin-right:4px; }
  .data-icon .icon{ width:19px; height:19px; }
  .file-line .icon{ width:14px; height:14px; margin-right:2px; }
  .report-draft-banner .icon{ width:14px; height:14px; margin-right:2px; }
  .pill .icon{ width:12px; height:12px; margin-right:1px; }

  /* ---------- Mobile / phone ---------- */
  @media (max-width:760px){
    .shell{ flex-direction:column; }
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:40;
      flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 14px;
      padding:12px 16px;
    }
    .brand{ padding:0; margin-right:auto; }
    .proto-badge{ margin:0; }
    .nav-group{ flex-direction:row; flex-wrap:wrap; gap:6px; width:100%; }
    .nav-label{ display:none; }
    .nav-link{ padding:7px 11px; }

    .topbar{ padding:14px 16px; }
    .content{ padding:20px 16px 60px; }
    .page-head h1{ font-size:1.35rem; }
    .page-head{ gap:14px; }
    .page-head .btn{ width:100%; justify-content:center; }

    .kv-grid{ grid-template-columns:1fr; }
    .cluster-svg-wrap{ padding:6px; }

    .report-doc{ padding:26px 18px; }
    .report-meta-grid{ grid-template-columns:1fr 1fr; }
    .report-actions{ flex-direction:column; }
    .report-actions .btn{ width:100%; justify-content:center; }

    .predict-result-grid{ grid-template-columns:1fr; }
    .predict-steps{ grid-template-columns:1fr; gap:18px; }
    .compare-row{ grid-template-columns:1fr; gap:6px; }
    .compare-pct{ text-align:left; }
    .predict-select-row select{ min-width:0; width:100%; }
    .predict-donut-row{ justify-content:center; text-align:center; }
    .donut-legend{ width:100%; }

    .tabs{ flex-wrap:wrap; width:100%; }
    .tab{ text-align:center; }

    .kpi-row{ grid-template-columns:1fr 1fr; }
    .sidebar-footer{ width:100%; margin-top:4px; padding-top:12px; }
  }

  @media (max-width:480px){
    .study-grid{ grid-template-columns:1fr; }
    .kpi-row{ grid-template-columns:1fr; }
    .img-gallery{ grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" stroke="#FBFBFB" stroke-width="1.1"/>
        <circle cx="9" cy="10" r="3.4" fill="#56B77E"/>
        <circle cx="15" cy="15" r="2.2" fill="#F2735B"/>
      </svg>
      <span>CellStories Platform</span>
    </div>
    <h1>Sign in to continue</h1>
    <p class="login-sub">Access your studies, cohort analyses, and reports.</p>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="you@cellstories.bio" required />
    <label>Password</label>
    <input type="password" id="login-password" placeholder="••••••••" required />
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign In</button>
    <p class="login-note">Demo access — any email and password combination is accepted.</p>
  </form>
</div>

<div class="shell" id="shell" style="display:none;">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <div class="content" id="app"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CellStories Platform — clickable prototype
   Static demo: sample data only, no real storage/AI backend.
   ========================================================= */

const DATA_TYPES = [
  { key:'blood',     label:'Blood Markers',            color:'coral' },
  { key:'history',   label:'Medical History',          color:'azure' },
  { key:'genetics',  label:'Genetic / Sequencing',     color:'sage'  },
  { key:'wearables', label:'Wearables & Symptoms',     color:'azure' },
  { key:'organoid',  label:'Organoid Experiments',     color:'sage'  },
];

const ICON_PATHS = {
  blood:     '<path d="M12 3s7 7.6 7 12.2A7 7 0 1 1 5 15.2C5 10.6 12 3 12 3Z"/>',
  history:   '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V4"/><path d="M8.2 10.5h7.6M8.2 14h7.6M8.2 17.5h5"/>',
  genetics:  '<path d="M7.5 3c0 6 9 6 9 12s-9 6-9 12"/><path d="M16.5 3c0 6-9 6-9 12s9 6 9 12"/><path d="M8 7.3h8M8 12h8M8 16.7h8"/>',
  wearables: '<rect x="6.5" y="6.5" width="11" height="11" rx="3.2"/><path d="M9 6.5V4.3A1.3 1.3 0 0 1 10.3 3h3.4A1.3 1.3 0 0 1 15 4.3V6.5M9 17.5v2.2A1.3 1.3 0 0 0 10.3 21h3.4a1.3 1.3 0 0 0 1.3-1.3v-2.2"/>',
  organoid:  '<path d="M9.3 3h5.4M10.2 3v6.4L4.9 19.6A2 2 0 0 0 6.7 22.6h10.6a2 2 0 0 0 1.8-2.9L13.8 9.4V3"/><path d="M7.6 15.2h8.8"/>',
  file:      '<path d="M7 3h7l4 4v13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20.5V4.5A1.5 1.5 0 0 1 7 3Z"/><path d="M14 3v4h4"/>',
  folder:    '<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/>',
  target:    '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.7" fill="currentColor" stroke="none"/>',
  warning:   '<path d="M12 3.5 21.5 20h-19Z"/><path d="M12 9.5v5M12 17.3h.01"/>',
  lock:      '<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  search:    '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.4-4.4"/>',
  chart:     '<path d="M4 20V10M11 20V4M18 20v-7"/>',
  users:     '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.8-6 6-6s6 2.4 6 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14c2.4.3 4.5 2.3 5 6"/>',
};
function icon(name, cls){
  return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;
}

function seedRandom(seed){
  return function(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; };
}

function seedState(){
  const rnd = seedRandom(42);
  function makeParticipants(prefix, count, addedBase){
    const arr = [];
    for(let i=1;i<=count;i++){
      const code = prefix+'-'+String(i).padStart(5,'0');
      const status = {};
      const fullyComplete = rnd() < 0.70;
      DATA_TYPES.forEach(dt=>{ status[dt.key] = fullyComplete ? true : rnd() > 0.35; });
      const d = new Date(addedBase); d.setDate(d.getDate() - Math.floor(rnd()*60));
      arr.push({ code, added: d.toISOString().slice(0,10), status, files:{} });
    }
    return arr;
  }
  return {
    studies:[
      { id:'ibd-fibrosis', name:'IBD Fibrosis Progression & Mechanobiology Study', prefix:'IBD', desc:"Internal translational cohort tracking multi-omic and organoid signatures — including extracellular matrix stiffness and collagen deposition — associated with fibrotic stricture progression in Crohn's disease and ulcerative colitis." },
      { id:'uf-cohort', name:'Uterine Fibroid Precision Cohort', prefix:'UF', desc:"CellStories' internal precision-medicine cohort, pairing patient-derived organoids with clinical, genetic, and wearable data to identify treatment-responsive uterine fibroid subtypes." },
      { id:'glp1-obesity', name:'Obesity — GLP-1 Responder Study', prefix:'GLP', desc:"Internal cohort study characterizing which obesity phenotypes respond best to GLP-1 receptor agonist therapy, pairing metabolic, genetic, and wearable data with organoid drug-response assays." },
    ],
    participants:{
      'ibd-fibrosis': makeParticipants('IBD', 60, '2026-07-15'),
      'uf-cohort': makeParticipants('UF', 80, '2026-07-20'),
      'glp1-obesity': makeParticipants('GLP', 40, '2026-07-18'),
    },
    cohortRun:{},
    reportGenerated:{}
  };
}

const STORE_KEY = 'cshub_prototype_v5';
let state;
try{
  const raw = localStorage.getItem(STORE_KEY);
  state = raw ? JSON.parse(raw) : seedState();
}catch(e){ state = seedState(); }
if(!state.reportGenerated) state.reportGenerated = {};
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------------- Router ---------------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/').filter(Boolean);
  return parts;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', initAuth);

function initAuth(){
  const authed = sessionStorage.getItem('cshub_authed') === '1';
  if(authed){ showApp(); return; }
  document.getElementById('login-form').addEventListener('submit', e=>{
    e.preventDefault();
    sessionStorage.setItem('cshub_authed', '1');
    showApp();
  });
}
function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  render();
}
function signOut(){
  sessionStorage.removeItem('cshub_authed');
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  location.hash = '';
}

function render(){
  const parts = parseHash();
  renderSidebar(parts);
  if(parts.length===0){ return renderStudiesPage(); }
  const studyId = parts[0];
  const study = state.studies.find(s=>s.id===studyId);
  if(!study){ location.hash=''; return; }
  if(parts[1]==='cohort'){ return renderCohortPage(study); }
  if(parts[1]==='report'){ return renderReportPage(study); }
  if(parts[1]==='predict'){ return renderPredictPage(study); }
  if(parts[1]==='participant' && parts[2]){ return renderParticipantPage(study, parts[2]); }
  return renderParticipantsPage(study);
}

/* ---------------- Sidebar ---------------- */
function renderSidebar(parts){
  const studyId = parts[0];
  const study = state.studies.find(s=>s.id===studyId);
  let html = `
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" stroke="#FBFBFB" stroke-width="1.1"/>
        <circle cx="9" cy="10" r="3.4" fill="#56B77E"/>
        <circle cx="15" cy="15" r="2.2" fill="#F2735B"/>
      </svg>
      <span>CellStories Platform</span>
    </a>
    <div class="proto-badge">Prototype · Sample Data</div>
    <div class="nav-group">
      <div class="nav-label">Workspace</div>
      <a class="nav-link ${!studyId?'active':''}" href="#/"><span class="dot"></span>All Studies</a>
    </div>`;
  if(study){
    html += `
    <div class="nav-group">
      <div class="nav-label">${escapeHtml(study.name)}</div>
      <a class="nav-link ${(!parts[1])?'active':''}" href="#/${study.id}"><span class="dot"></span>Participants</a>
      <a class="nav-link ${parts[1]==='cohort'?'active':''}" href="#/${study.id}/cohort"><span class="dot"></span>Cohort Analysis</a>
      <a class="nav-link ${parts[1]==='report'?'active':''}" href="#/${study.id}/report"><span class="dot"></span>Study Report</a>
      <a class="nav-link ${parts[1]==='predict'?'active':''}" href="#/${study.id}/predict"><span class="dot"></span>Subtype Predictor</a>
    </div>`;
  }
  html += `
    <div class="sidebar-footer">
      <div class="sidebar-security">${icon('lock')}<span>Built for HIPAA &amp; SOC 2–aligned data handling</span></div>
      <button class="sidebar-signout" onclick="signOut()">Sign out</button>
    </div>`;
  document.getElementById('sidebar').innerHTML = html;
}

function renderBreadcrumb(items){
  document.getElementById('breadcrumb').innerHTML = items.map((it,i)=>{
    const last = i===items.length-1;
    return (i>0?'<span class="sep">/</span>':'') + (last ? `<span class="current">${escapeHtml(it.label)}</span>` : `<a href="${it.href}">${escapeHtml(it.label)}</a>`);
  }).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Studies Page ---------------- */
function renderStudiesPage(){
  renderBreadcrumb([{label:'All Studies', href:'#/'}]);
  const app = document.getElementById('app');

  const totalParticipants = state.studies.reduce((sum,s)=> sum + (state.participants[s.id]||[]).length, 0);
  let doneSum=0, slotCount=0;
  state.studies.forEach(s=>{
    (state.participants[s.id]||[]).forEach(p=>{
      doneSum += Object.values(p.status).filter(Boolean).length;
      slotCount += DATA_TYPES.length;
    });
  });
  const avgCompletion = slotCount ? Math.round(doneSum/slotCount*100) : 0;
  const subtypesIdentified = state.studies.reduce((sum,s)=> sum + (state.cohortRun[s.id] ? groupsFor(s).length : 0), 0);

  app.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">Workspace</span>
        <h1>Overview</h1>
        <p>Each study maintains its own participant roster and patient-code numbering scheme.</p>
      </div>
      <button class="btn btn-primary" id="new-study-btn">+ New Study</button>
    </div>
    <div class="kpi-row">
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--azure-soft);color:var(--azure-dim)">${icon('users')}</div>
        <div><div class="kpi-num">${totalParticipants}</div><div class="kpi-lbl">Participants across all studies</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--sage-soft);color:var(--sage-dim)">${icon('folder')}</div>
        <div><div class="kpi-num">${state.studies.length}</div><div class="kpi-lbl">Active studies</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--coral-soft);color:var(--coral-hover)">${icon('chart')}</div>
        <div><div class="kpi-num">${avgCompletion}%</div><div class="kpi-lbl">Average data completeness</div></div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-icon" style="background:var(--azure-soft);color:var(--azure-dim)">${icon('target')}</div>
        <div><div class="kpi-num">${subtypesIdentified}</div><div class="kpi-lbl">Candidate subtypes identified</div></div>
      </div>
    </div>
    <div class="study-grid">
      ${state.studies.map(s=>{
        const n = (state.participants[s.id]||[]).length;
        return `<a href="#/${s.id}" class="card study-card">
          <span class="prefix-chip">${escapeHtml(s.prefix)}-#####</span>
          <h3>${escapeHtml(s.name)}</h3>
          <div class="meta"><span>${n} participant${n===1?'':'s'}</span></div>
        </a>`;
      }).join('')}
      <div class="study-card-new" id="new-study-btn-2">+ New Study</div>
    </div>
  `;
  document.getElementById('new-study-btn').onclick = openNewStudyModal;
  document.getElementById('new-study-btn-2').onclick = openNewStudyModal;
}

function openNewStudyModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>New Study</h3>
        <label>Study name</label>
        <input id="m-name" placeholder="e.g. Mount Sinai — Endocrine Study" />
        <label>Code prefix</label>
        <input id="m-prefix" placeholder="e.g. MSH" maxlength="6" style="text-transform:uppercase" />
        <div class="actions">
          <button class="btn btn-ghost" id="m-cancel">Cancel</button>
          <button class="btn btn-primary" id="m-create">Create Study</button>
        </div>
      </div>
    </div>`;
  document.getElementById('overlay').onclick = e=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-create').onclick = ()=>{
    const name = document.getElementById('m-name').value.trim();

    const q = document.getElementById('p-search').value.trim().toLowerCase();
    const filter = document.getElementById('p-filter').value;
    const sortBy = document.getElementById('p-sort').value;
    let rows = list.filter(p=>{
      if(q && !p.code.toLowerCase().includes(q)) return false;
      const done = Object.values(p.status).filter(Boolean).length;
      if(filter==='complete' && done!==DATA_TYPES.length) return false;
      if(filter==='partial' && (done===0 || done===DATA_TYPES.length)) return false;
      if(filter==='none' && done!==0) return false;
      return true;
    });
    rows = rows.slice().sort((a,b)=>{
      const da = Object.values(a.status).filter(Boolean).length;
      const db = Object.values(b.status).filter(Boolean).length;
      if(sortBy==='completion-desc') return db-da;
      if(sortBy==='completion-asc') return da-db;
      if(sortBy==='added-desc') return b.added.localeCompare(a.added);
      if(sortBy==='added-asc') return a.added.localeCompare(b.added);
      return a.code.localeCompare(b.code, undefined, {numeric:true});
    });
    document.getElementById('p-tbody').innerHTML = rows.map(p=>`
      <tr onclick="location.hash='#/${study.id}/participant/${p.code}'">

  }

  document.getElementById('p-search').addEventListener('input', draw);
  document.getElementById('p-filter').addEventListener('change', draw);
  document.getElementById('p-sort').addEventListener('change', draw);
  draw();
}

function completionBar(p){
  const total = DATA_TYPES.length;
  const done = Object.values(p.status).filter(Boolean).length;
  const pct = Math.round((done/total)*100);
  const complete = done===total;
  return `<div class="completion ${complete?'complete':''}">
    <div class="completion-track"><div class="completion-fill" style="width:${pct}%"></div></div>
    <span class="completion-pct">${pct}%</span>
  </div>`;
}

function sparkline(values, color){
  const w=560,h=80,pad=6;
  const max=Math.max(...values), min=Math.min(...values);
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = h-pad - ((v-min)/(max-min||1))*(h-2*pad);
    return x+','+y;
  }).join(' ');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderHeatmap(genes, conditions, matrix){
  const maxAbs = Math.max(...matrix.flat().map(Math.abs)) || 1;
  const header = `<tr><th></th>${conditions.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  const rows = genes.map((g,ri)=>{
    const cells = matrix[ri].map(v=>{
      const alpha = (Math.abs(v)/maxAbs*0.82+0.08).toFixed(2);
      const bg = v>=0 ? `rgba(242,115,91,${alpha})` : `rgba(62,155,214,${alpha})`;
      const textColor = alpha>0.5 ? '#fff' : 'var(--ink-dim)';
      return `<td class="heat-cell" style="background:${bg};color:${textColor}">${v>0?'+':''}${v.toFixed(1)}</td>`;
    }).join('');
    return `<tr><th class="heat-row-label">${g}</th>${cells}</tr>`;
  }).join('');
  return `<div class="heatmap-wrap"><table class="heatmap"><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}

function buildClusterDots(groups, seed){
  const rnd = seedRandom(seed);
  const centers = { a:[150,150], b:[380,120], c:[300,260] };
  const plotW = 560, plotH = 340, pad = 30;
  const dots = [];
  groups.forEach(g=>{
    for(let i=0;i<g.n;i++){
      if(g.id==='u'){
        // Outliers: scattered across the plot rather than clustered — these
        // are the participants real pattern-detection can't confidently place.
        dots.push({ group:g.id, x: pad+rnd()*(plotW-2*pad), y: pad+rnd()*(plotH-2*pad) });
        continue;
      }
      const [cx,cy] = centers[g.id];
      const ang = rnd()*Math.PI*2, rad = rnd()*46;
      dots.push({ group:g.id, x:cx+Math.cos(ang)*rad, y:cy+Math.sin(ang)*rad });
    }
  });
  return dots;
}

function sampleCodesForGroup(list, n, offset){
  if(!list.length) return [];
  const out = [];
  const shown = Math.min(n,6);
  for(let i=0;i<shown;i++){ out.push(list[(offset+i)%list.length].code); }
  if(n>shown) out.push('+'+(n-shown)+' more');
  return out;
}

function allCodesForGroup(list, n, offset){
  if(!list.length) return [];
  const out = [];
  for(let i=0;i<n;i++){ out.push(list[(offset+i)%list.length].code); }
  return out;
}

/* ---------------- Study Report ---------------- */
function computeCompletionStats(list){
  const total = list.length;
  let sumPct = 0, fullyComplete = 0, noData = 0;
  const perType = {}; DATA_TYPES.forEach(dt=>perType[dt.key]=0);
  list.forEach(p=>{
    const done = Object.values(p.status).filter(Boolean).length;
    sumPct += (done/DATA_TYPES.length)*100;
    if(done===DATA_TYPES.length) fullyComplete++;
    if(done===0) noData++;
    DATA_TYPES.forEach(dt=>{ if(p.status[dt.key]) perType[dt.key]++; });
  });
  const avgPct = total ? Math.round(sumPct/total) : 0;
  return { total, avgPct, fullyComplete, noData, partial: total-fullyComplete-noData, perType };
}

/* ---------------- Subtype Predictor ---------------- */
const CHEAP_TYPES = ['blood','history','wearables'];

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function cheapDataComplete(p){
  return CHEAP_TYPES.every(k=>p.status[k]);
}

function predictForParticipant(code, groups){
  const trueIdx = hashStr(code+'|true') % groups.length;
  const flip = (hashStr(code+'|flip') % 100) < 12;
  let predIdx = trueIdx;
  if(flip){ predIdx = (trueIdx + 1 + (hashStr(code+'|flipto') % (groups.length-1))) % groups.length; }
  const confidence = flip
    ? 55 + (hashStr(code+'|conf') % 15)
    : 78 + (hashStr(code+'|conf') % 18);

  const probs = new Array(groups.length).fill(0);
  probs[predIdx] = confidence;
  let remaining = 100 - confidence;
  const others = groups.map((_,i)=>i).filter(i=>i!==predIdx);

  function splitAmong(idxs, total){
    if(idxs.length===0) return;
    const weights = idxs.map((_,k)=>1+(hashStr(code+'|w'+k)%5));
    const totalW = weights.reduce((a,b)=>a+b,0);
    let used = 0;
    idxs.forEach((i,k)=>{
      const share = (k===idxs.length-1) ? (total-used) : Math.round(total*weights[k]/totalW);
      used += share;
      probs[i] += share;
    });
  }

  if(flip){
    const trueShare = Math.round(remaining * (0.5 + (hashStr(code+'|trueshare')%20)/100));
    probs[trueIdx] += trueShare;
    splitAmong(others.filter(i=>i!==trueIdx), remaining-trueShare);
  } else {
    splitAmong(others, remaining);
  }

  return { trueIdx, predIdx, confidence, matches: !flip, probs };
}

function renderDonut(probs, highlightIdx, groups){
  const size = 132, stroke = 18;
  const r = (size-stroke)/2, cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  let cumulative = 0;
  const arcs = groups.map((g,i)=>{
    const pct = probs[i];
    const dash = (pct/100)*circ;
    const offset = -(cumulative/100)*circ;
    cumulative += pct;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--${g.color})" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})" opacity="${i===highlightIdx?1:0.55}"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="22" fill="var(--ink)">${probs[highlightIdx]}%</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="var(--mono)" font-size="8.5" letter-spacing="0.03em" fill="var(--ink-faint)">CONFIDENCE</text>
  </svg>`;
}

              <span class="eyebrow" style="color:var(--sage-dim)">Full-panel reference · 5/5 data types</span>
              <div class="report-subtype-row">
                <span class="sw" style="background:var(--${trueGroup.color})">${trueIdx+1}</span>
                <div><strong>${trueGroup.title}</strong></div>
              </div>
              <div style="margin-top:14px;">
                ${matches
                  ? `<span class="pill done">✓ Matches Quick Predict</span>`
                  : `<span class="pill" style="background:var(--coral-soft);color:var(--coral-hover);">${icon('warning')} Differs — recommend confirmatory testing</span>`}
              </div>
            </div>
          </div>
        </div>`;
    }, 700);
  };
}
</script>
</body>
</html>
